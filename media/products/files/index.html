<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <title>TG STORE | Premium Digital Shop</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at 10% 20%, #0a0f1e, #03050b);
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
      color: #f0f3fc;
      padding: 1.5rem 1.25rem 4rem;
      min-height: 100vh;
      scroll-behavior: smooth;
    }

    /* Glassmorphism core */
    .glass-card, .product-card, .modal-content, .search-bar, .category-btn {
      background: rgba(15, 25, 45, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(80, 130, 255, 0.25);
      border-radius: 28px;
      box-shadow: 0 12px 32px -12px rgba(0, 0, 0, 0.5), 0 0 0 0.5px rgba(80, 150, 255, 0.1) inset;
      transition: all 0.25s ease;
    }

    /* container */
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* header + title */
    .shop-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .logo-area h1 {
      font-size: 1.9rem;
      font-weight: 700;
      background: linear-gradient(135deg, #b2baff, #5f7cff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.3px;
    }
    .logo-area p {
      font-size: 0.85rem;
      opacity: 0.7;
    }

    /* search + filter row */
    .action-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
      align-items: center;
      justify-content: space-between;
    }
    .search-bar {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.7rem 1.2rem;
      flex: 1;
      min-width: 180px;
      background: rgba(10, 18, 32, 0.65);
    }
    .search-bar i {
      font-size: 1.2rem;
      opacity: 0.8;
    }
    .search-bar input {
      background: transparent;
      border: none;
      width: 100%;
      font-size: 1rem;
      color: white;
      outline: none;
      font-weight: 500;
    }
    .search-bar input::placeholder {
      color: #8e9dbb;
    }

    /* categories */
    .categories {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 2.2rem;
      overflow-x: auto;
      padding-bottom: 0.3rem;
      scrollbar-width: thin;
    }
    .category-btn {
      background: rgba(20, 30, 55, 0.7);
      border: none;
      padding: 0.6rem 1.3rem;
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: 40px;
      color: #eef3ff;
      cursor: pointer;
      transition: 0.2s;
      backdrop-filter: blur(8px);
      white-space: nowrap;
    }
    .category-btn.active {
      background: linear-gradient(135deg, #3b5eff, #7c3eff);
      box-shadow: 0 6px 14px rgba(59, 94, 255, 0.4);
      border-color: rgba(255,255,255,0.3);
    }
    .category-btn:active { transform: scale(0.96); }

    /* product grid */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.6rem;
      margin-top: 1rem;
    }

    /* product card */
    .product-card {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1), box-shadow 0.3s;
      background: rgba(12, 20, 35, 0.6);
      border-radius: 28px;
    }
    .product-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 22px 32px -16px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(90, 150, 255, 0.4);
    }
    .product-card:active {
      transform: scale(0.97);
      transition: 0.08s;
    }
    .img-wrapper {
      position: relative;
      overflow: hidden;
      background: #0a1020;
      aspect-ratio: 1 / 1;
    }
    .product-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease, opacity 0.35s;
      opacity: 0;
    }
    .product-img.loaded {
      opacity: 1;
    }
    .product-card:hover .product-img {
      transform: scale(1.05);
    }
    .badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: linear-gradient(115deg, #ffb347, #ff6b4a);
      color: white;
      font-size: 0.7rem;
      font-weight: bold;
      padding: 0.25rem 0.8rem;
      border-radius: 30px;
      backdrop-filter: blur(4px);
      z-index: 2;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .card-info {
      padding: 1rem 1rem 1.2rem;
    }
    .card-info h3 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
    }
    .price {
      font-size: 1.35rem;
      font-weight: 800;
      background: linear-gradient(135deg, #c0e0ff, #a07eff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin: 0.4rem 0;
    }
    .buy-btn {
      background: rgba(59, 94, 255, 0.85);
      border: none;
      width: 100%;
      padding: 0.7rem 0;
      border-radius: 40px;
      font-weight: bold;
      color: white;
      font-size: 0.9rem;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 0.6rem;
      backdrop-filter: blur(4px);
    }
    .buy-btn:active { transform: scale(0.96); background: #2f4ad0; }

    /* skeleton loader */
    .skeleton-card {
      background: rgba(25, 35, 55, 0.6);
      border-radius: 28px;
      backdrop-filter: blur(8px);
      aspect-ratio: 3/4;
      animation: pulse 1.2s infinite ease-in-out;
    }
    @keyframes pulse {
      0% { opacity: 0.5; }
      50% { opacity: 0.9; }
      100% { opacity: 0.5; }
    }

    /* MODAL */
    .modal {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      visibility: hidden;
      opacity: 0;
      transition: visibility 0.2s, opacity 0.25s ease;
      z-index: 1000;
    }
    .modal.active {
      visibility: visible;
      opacity: 1;
    }
    .modal-content {
      max-width: 340px;
      width: 85%;
      padding: 1.8rem 1.5rem;
      text-align: center;
      transform: scale(0.92);
      transition: transform 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.2);
      background: rgba(10, 18, 32, 0.9);
      border-radius: 36px;
    }
    .modal.active .modal-content {
      transform: scale(1);
    }
    .modal-content h3 {
      margin-bottom: 0.75rem;
      font-size: 1.7rem;
    }
    .card-number {
      background: #03070f;
      padding: 0.8rem;
      border-radius: 60px;
      font-family: monospace;
      font-size: 1.25rem;
      letter-spacing: 1px;
      margin: 1rem 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .copy-btn {
      background: #2e3b6e;
      border: none;
      padding: 0.4rem 1rem;
      border-radius: 40px;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .close-modal {
      margin-top: 1rem;
      background: #ff4d6d;
      border: none;
      padding: 0.6rem;
      width: 100%;
      border-radius: 50px;
      color: white;
      font-weight: bold;
    }
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) scale(0.9);
      background: #1f2a48e6;
      backdrop-filter: blur(20px);
      padding: 0.8rem 1.8rem;
      border-radius: 60px;
      color: white;
      font-weight: 500;
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
      z-index: 1100;
      font-size: 0.9rem;
      border: 1px solid rgba(255,255,200,0.3);
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }
    /* Scroll reveal */
    .reveal {
      opacity: 0;
      transform: translateY(18px);
      transition: opacity 0.55s ease, transform 0.55s ease;
    }
    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Responsive Grid */
    @media (max-width: 1200px) {
      .products-grid { grid-template-columns: repeat(3, 1fr); gap: 1.3rem; }
      body { padding: 1rem; }
    }
    @media (max-width: 768px) {
      .products-grid { grid-template-columns: repeat(2, 1fr); gap: 1rem; }
      .shop-header { flex-direction: column; align-items: start; }
      .card-info h3 { font-size: 0.95rem; }
      .price { font-size: 1.1rem; }
      .buy-btn { padding: 0.6rem; font-size: 0.8rem; }
    }
    @media (max-width: 480px) {
      .products-grid { gap: 0.85rem; }
      .card-info { padding: 0.7rem; }
      .category-btn { padding: 0.45rem 1rem; font-size: 0.8rem; }
      .search-bar { padding: 0.5rem 1rem; }
    }
    body.modal-open { overflow: hidden; }
  </style>
</head>
<body>
<div class="container">
  <div class="shop-header">
    <div class="logo-area">
      <h1>✨ TG STORE</h1>
      <p>Premium digital goods • instant delivery</p>
    </div>
  </div>
  <div class="action-bar">
    <div class="search-bar glass-card">
      <span>🔍</span>
      <input type="text" id="searchInput" placeholder="Search products...">
    </div>
  </div>
  <div class="categories" id="categoriesContainer"></div>
  <div id="productsGrid" class="products-grid"></div>
</div>

<div id="modal" class="modal">
  <div class="modal-content">
    <h3>💎 Payment details</h3>
    <p>Card for payment (USDT / Crypto)</p>
    <div class="card-number">
      <span id="cardNumberDisplay">**** **** **** 1234</span>
      <button class="copy-btn" id="copyCardBtn">Copy</button>
    </div>
    <button class="close-modal" id="closeModalBtn">Close</button>
  </div>
</div>
<div id="toast" class="toast">✅ Copied!</div>

<script>
  // ---------- PRODUCT DATA (unchanged structure, improved visual) ----------
  const productsData = [
    { id: 1, name: "Premium Telegram Stars", category: "Stars", price: "$4.99", image: "https://picsum.photos/id/104/300/300", top: true, cardNumber: "4485 1234 5678 9101" },
    { id: 2, name: "TG VIP Subscription", category: "Subscriptions", price: "$12.99", image: "https://picsum.photos/id/20/300/300", top: false, cardNumber: "4485 2345 6789 1011" },
    { id: 3, name: "Digital Gift Card", category: "Gift Cards", price: "$25.00", image: "https://picsum.photos/id/26/300/300", top: true, cardNumber: "4485 3456 7890 1213" },
    { id: 4, name: "Cloud Storage Pro", category: "Software", price: "$9.99", image: "https://picsum.photos/id/0/300/300", top: false, cardNumber: "4485 4567 8901 1415" },
    { id: 5, name: "Anime Stickers Pack", category: "Stickers", price: "$3.49", image: "https://picsum.photos/id/106/300/300", top: false, cardNumber: "4485 5678 9012 1617" },
    { id: 6, name: "Exclusive NFT Badge", category: "NFT", price: "$19.99", image: "https://picsum.photos/id/29/300/300", top: true, cardNumber: "4485 6789 0123 1819" },
    { id: 7, name: "Telegram Premium 1Y", category: "Subscriptions", price: "$34.99", image: "https://picsum.photos/id/155/300/300", top: false, cardNumber: "4485 7890 1234 2021" },
    { id: 8, name: "Music Streaming Key", category: "Software", price: "$6.99", image: "https://picsum.photos/id/22/300/300", top: false, cardNumber: "4485 8901 2345 2223" }
  ];

  let currentCategory = "All";
  let searchQuery = "";

  // DOM elements
  const productsGrid = document.getElementById("productsGrid");
  const categoriesContainer = document.getElementById("categoriesContainer");
  const searchInput = document.getElementById("searchInput");
  const modal = document.getElementById("modal");
  const cardNumberSpan = document.getElementById("cardNumberDisplay");
  const copyBtn = document.getElementById("copyCardBtn");
  const closeModalBtn = document.getElementById("closeModalBtn");
  const toastEl = document.getElementById("toast");

  let currentCardRaw = "";

  // helpers: toast
  function showToast(message, isError = false) {
    toastEl.textContent = message || (isError ? "⚠️ Error" : "✅ Copied!");
    toastEl.classList.add("show");
    setTimeout(() => toastEl.classList.remove("show"), 2200);
  }

  // copy to clipboard
  function copyToClipboard(text) {
    navigator.clipboard.writeText(text).then(() => {
      showToast("✅ Card copied!");
    }).catch(() => {
      showToast("⚠️ Manual copy", true);
    });
  }

  // Modal handlers
  function openModal(cardNumber) {
    currentCardRaw = cardNumber;
    cardNumberSpan.innerText = cardNumber;
    modal.classList.add("active");
    document.body.classList.add("modal-open");
  }
  function closeModalFn() {
    modal.classList.remove("active");
    document.body.classList.remove("modal-open");
  }
  copyBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    if (currentCardRaw) copyToClipboard(currentCardRaw);
    else showToast("No card data", true);
  });
  closeModalBtn.addEventListener("click", closeModalFn);
  modal.addEventListener("click", (e) => { if(e.target === modal) closeModalFn(); });

  // ---------- render skeleton ----------
  let skeletonTimeout;
  function showSkeletons() {
    productsGrid.innerHTML = "";
    for(let i=0; i<8; i++) {
      const skel = document.createElement("div");
      skel.className = "skeleton-card";
      productsGrid.appendChild(skel);
    }
  }

  // image lazy + fade + fallback
  function setupImage(imgElement, src) {
    imgElement.classList.remove("loaded");
    imgElement.src = src;
    imgElement.onload = () => {
      imgElement.classList.add("loaded");
    };
    imgElement.onerror = () => {
      imgElement.src = "https://picsum.photos/id/100/300/300";
      imgElement.classList.add("loaded");
    };
    if(imgElement.complete) imgElement.classList.add("loaded");
  }

  // product card creation with doc fragment
  function buildProductCard(product) {
    const card = document.createElement("div");
    card.className = "product-card reveal";
    const imgWrapper = document.createElement("div");
    imgWrapper.className = "img-wrapper";
    const img = document.createElement("img");
    img.className = "product-img";
    img.loading = "lazy";
    setupImage(img, product.image);
    imgWrapper.appendChild(img);
    if(product.top) {
      const badgeSpan = document.createElement("span");
      badgeSpan.className = "badge";
      badgeSpan.innerText = "🔥 TOP";
      imgWrapper.appendChild(badgeSpan);
    }
    const infoDiv = document.createElement("div");
    infoDiv.className = "card-info";
    const title = document.createElement("h3");
    title.innerText = product.name;
    const priceSpan = document.createElement("div");
    priceSpan.className = "price";
    priceSpan.innerText = product.price;
    const buyBtn = document.createElement("button");
    buyBtn.className = "buy-btn";
    buyBtn.innerText = "Buy Now";
    buyBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      openModal(product.cardNumber);
    });
    infoDiv.appendChild(title);
    infoDiv.appendChild(priceSpan);
    infoDiv.appendChild(buyBtn);
    card.appendChild(imgWrapper);
    card.appendChild(infoDiv);
    // Optional: click card also shows modal?
    card.addEventListener("click", (e) => {
      if(e.target !== buyBtn) openModal(product.cardNumber);
    });
    return card;
  }

  // filter logic
  function getFilteredProducts() {
    let filtered = productsData.filter(p => {
      if(currentCategory !== "All" && p.category !== currentCategory) return false;
      if(searchQuery.trim() !== "") {
        return p.name.toLowerCase().includes(searchQuery.toLowerCase());
      }
      return true;
    });
    return filtered;
  }

  function renderProducts() {
    // clear grid and apply smooth reflow
    const fragment = document.createDocumentFragment();
    const filtered = getFilteredProducts();
    if(filtered.length === 0) {
      productsGrid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:3rem;">✨ No products found ✨</div>`;
      return;
    }
    filtered.forEach(product => {
      fragment.appendChild(buildProductCard(product));
    });
    productsGrid.innerHTML = "";
    productsGrid.appendChild(fragment);
    // trigger scroll reveal
    const revealItems = document.querySelectorAll(".reveal");
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if(entry.isIntersecting) entry.target.classList.add("visible");
      });
    }, { threshold: 0.1 });
    revealItems.forEach(el => observer.observe(el));
  }

  // debounced search
  let debounceTimer;
  function onSearchInput(e) {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
      searchQuery = e.target.value;
      renderProducts();
    }, 280);
  }

  // category switching with animation (fade out/in effect - replace content)
  function switchCategory(category) {
    if(currentCategory === category) return;
    currentCategory = category;
    // add active state transition effect: brief skeleton to smooth
    showSkeletons();
    setTimeout(() => {
      renderProducts();
    }, 45);
    // update active class on buttons
    document.querySelectorAll(".category-btn").forEach(btn => {
      if(btn.getAttribute("data-cat") === category) btn.classList.add("active");
      else btn.classList.remove("active");
    });
  }

  function buildCategories() {
    const cats = new Set(productsData.map(p => p.category));
    const catArray = ["All", ...Array.from(cats)];
    const fragment = document.createDocumentFragment();
    catArray.forEach(cat => {
      const btn = document.createElement("button");
      btn.className = "category-btn";
      if(cat === "All") btn.classList.add("active");
      btn.innerText = cat;
      btn.setAttribute("data-cat", cat);
      btn.addEventListener("click", () => switchCategory(cat));
      fragment.appendChild(btn);
    });
    categoriesContainer.appendChild(fragment);
  }

  // gradient background animation subtle
  const addGradientMotion = () => {
    let hue = 0;
    setInterval(() => {
      hue = (hue + 0.3) % 360;
      document.body.style.background = `radial-gradient(circle at 30% 10%, hsl(${hue}, 55%, 8%), #020308)`;
    }, 80);
  };
  // performance: avoid many reflows, use CSS will-change
  function init() {
    buildCategories();
    showSkeletons();
    setTimeout(() => {
      renderProducts();
    }, 60);
    searchInput.addEventListener("input", onSearchInput);
    addGradientMotion();
    // prevent body scroll on modal
    window.addEventListener("keydown", (e) => {
      if(e.key === "Escape" && modal.classList.contains("active")) closeModalFn();
    });
  }

  // resize + image lazy init
  init();
</script>
</body>
</html>
